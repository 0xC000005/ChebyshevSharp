coverage:
  status:
    patch:
      default:
        target: 90%
        paths:
          - "src"
        if_not_found: success
    project:
      default:
        target: auto
        threshold: 1%
        paths:
          - "src"
        if_not_found: success

comment:
  layout: "condensed_header, diff, files"
  behavior: default
