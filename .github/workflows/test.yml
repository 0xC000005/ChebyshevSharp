name: Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validation:
    name: Format, Pack, and Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Verify formatting
        run: dotnet format --verify-no-changes --verbosity minimal

      - name: Build release
        run: dotnet build --configuration Release --no-restore

      - name: Run examples
        run: |
          dotnet run --configuration Release --no-build --project examples/QuickStart/QuickStart.csproj
          dotnet run --configuration Release --no-build --project examples/SliderPartitionValidation/SliderPartitionValidation.csproj
          dotnet run --configuration Release --no-build --project examples/TensorTrainHighDim/TensorTrainHighDim.csproj
          dotnet run --configuration Release --no-build --project examples/FixedRateBondSurrogate/FixedRateBondSurrogate.csproj

      - name: Pack with package validation
        run: dotnet pack src/ChebyshevSharp --configuration Release --no-build --output artifacts/packages

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.78.5

      - name: Build docs
        run: docfx docs/docfx.json

  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: [validation]
    strategy:
      matrix:
        include:
          - name: .NET 8 library build
            dotnet-version: "8.0.x"
            target-framework: net8.0
            project: src/ChebyshevSharp/ChebyshevSharp.csproj
            run-tests: false
            upload-coverage: false
          - name: .NET 10 tests
            dotnet-version: "10.0.x"
            target-framework: net10.0
            project: tests/ChebyshevSharp.Tests/ChebyshevSharp.Tests.csproj
            run-tests: true
            upload-coverage: true

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        id: setup-dotnet
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Select requested SDK
        run: dotnet new globaljson --sdk-version "${{ steps.setup-dotnet.outputs.dotnet-version }}" --roll-forward latestFeature --force

      - name: Show selected SDK
        run: dotnet --version

      - name: Restore dependencies
        run: dotnet restore ${{ matrix.project }} -p:TargetFramework=${{ matrix.target-framework }}

      - name: Build
        run: dotnet build ${{ matrix.project }} --framework ${{ matrix.target-framework }} --no-restore

      - name: Run tests
        if: matrix.run-tests == true
        run: dotnet test ${{ matrix.project }} --framework ${{ matrix.target-framework }} --no-build --verbosity normal --collect:"XPlat Code Coverage" -- RunConfiguration.DisableParallelization=true

      - name: Upload coverage to Codecov
        if: matrix.upload-coverage == true
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: tests/ChebyshevSharp.Tests/TestResults/**/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}

  all-tests:
    name: All Tests Passed
    runs-on: ubuntu-latest
    needs: [validation, test]
    if: always()
    steps:
      - name: Check validation and test results
        run: |
          if [[ "${{ needs.validation.result }}" != "success" ]]; then
            echo "Validation failed"
            exit 1
          fi
          if [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "Tests failed"
            exit 1
          fi
