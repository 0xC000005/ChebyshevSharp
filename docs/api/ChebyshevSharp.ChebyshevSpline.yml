  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Auto-place knots at function kinks via a curvature-spike scan, then build the

    resulting <xref href="ChebyshevSharp.ChebyshevSpline" data-throw-if-not-resolved="false"></xref>. Mirrors PyChebyshev <code>spline.py:2111</code>.
  remarks: >-
    When <code class="paramref">nWorkers</code> is non-null, <code class="paramref">function</code> may be

    invoked concurrently from multiple threads. Functions that capture mutable state

    must use locks or external synchronization, or pass <code>nWorkers: null</code>.
  example: []
  syntax:
    content: public static ChebyshevSpline AutoKnots(Func<double[], object?, double> function, int numDimensions, double[][] domain, int[] numNodes, int maxOrderDerivative = 2, object? additionalData = null, string? descriptor = null, double thresholdFactor = 5, int maxKnotsPerDim = 5, int nScanPoints = 200, int? nWorkers = null, IProgress<int>? progress = null, bool verbose = false)
    parameters:
    - id: function
      type: System.Func{System.Double[],System.Object,System.Double}
      description: f(point, additionalData) → double; must return finite at every scan point.
    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds for each dimension as double[ndim][2].
    - id: numNodes
      type: System.Int32[]
      description: Per-piece node counts; same shape as the regular ctor.
    - id: maxOrderDerivative
      type: System.Int32
      description: Max derivative order. Default 2.
    - id: additionalData
      type: System.Object
      description: Optional user data threaded through f calls.
    - id: descriptor
      type: System.String
      description: Optional free-form descriptor.
    - id: thresholdFactor
      type: System.Double
      description: Spike threshold = thresholdFactor × mean(|d²f|). Default 5.0.
    - id: maxKnotsPerDim
      type: System.Int32
      description: Cap on knots per dimension. Default 5. Zero means no auto-knots.
    - id: nScanPoints
      type: System.Int32
      description: Number of scan points per dim. Default 200; must be at least 3.
    - id: nWorkers
      type: System.Nullable{System.Int32}
      description: See <xref href="ChebyshevSharp.ChebyshevSpline" data-throw-if-not-resolved="false"></xref> ctor.
    - id: progress
      type: System.IProgress{System.Int32}
      description: See <xref href="ChebyshevSharp.ChebyshevSpline" data-throw-if-not-resolved="false"></xref> ctor.
    - id: verbose
      type: System.Boolean
      description: If true, print scan progress.
    return:
      type: ChebyshevSharp.ChebyshevSpline
      description: A built ChebyshevSpline with the discovered knots.
    content.vb: Public Shared Function AutoKnots([function] As Func(Of Double(), Object, Double), numDimensions As Integer, domain As Double()(), numNodes As Integer(), maxOrderDerivative As Integer = 2, additionalData As Object = Nothing, descriptor As String = Nothing, thresholdFactor As Double = 5, maxKnotsPerDim As Integer = 5, nScanPoints As Integer = 200, nWorkers As Integer? = Nothing, progress As IProgress(Of Integer) = Nothing, verbose As Boolean = False) As ChebyshevSpline
  overload: ChebyshevSharp.ChebyshevSpline.AutoKnots*
  nameWithType.vb: ChebyshevSpline.AutoKnots(Func(Of Double(), Object, Double), Integer, Double()(), Integer(), Integer, Object, String, Double, Integer, Integer, Integer?, IProgress(Of Integer), Boolean)
  fullName.vb: ChebyshevSharp.ChebyshevSpline.AutoKnots(System.Func(Of Double(), Object, Double), Integer, Double()(), Integer(), Integer, Object, String, Double, Integer, Integer, Integer?, System.IProgress(Of Integer), Boolean)
  name.vb: AutoKnots(Func(Of Double(), Object, Double), Integer, Double()(), Integer(), Integer, Object, String, Double, Integer, Integer, Integer?, IProgress(Of Integer), Boolean)
