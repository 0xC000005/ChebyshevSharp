  example: []
  syntax:
    content: public ChebyshevSpline(Func<double[], object?, double> function, int numDimensions, double[][] domain, int[][] nNodesNested, double[][] knots, int maxDerivativeOrder = 2, object? additionalData = null, bool deferBuild = false, int? nWorkers = null, IProgress<int>? progress = null)
