    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds per dimension.
    - id: nNodesNested
      type: System.Int32[][]
      description: 'Nested array: nNodesNested[d][i] is the node count for piece i along dim d. Length per dim must equal knots[d].Length + 1.'
