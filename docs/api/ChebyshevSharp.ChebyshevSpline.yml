  commentId: M:ChebyshevSharp.ChebyshevSpline.SobolIndices
  id: SobolIndices
  parent: ChebyshevSharp.ChebyshevSpline
  langs:
  - csharp
  - vb
  name: SobolIndices()
  nameWithType: ChebyshevSpline.SobolIndices()
  fullName: ChebyshevSharp.ChebyshevSpline.SobolIndices()
  type: Method
  source:
    id: SobolIndices
    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevSpline.cs
    startLine: 1987
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Compute variance-based sensitivity indices aggregated across spline pieces.

    Per-piece coefficients are computed under the Chebyshev measure on each piece's

    local domain; per-piece contributions are weighted by domain volume × variance,

    then normalized by global variance. For a single-piece spline, this reduces to

    the <xref href="ChebyshevSharp.ChebyshevApproximation.SobolIndices" data-throw-if-not-resolved="false"></xref> case.
  example: []
  syntax:
    content: public SobolResult SobolIndices()
    return:
      type: ChebyshevSharp.SobolResult
      description: A <xref href="ChebyshevSharp.SobolResult" data-throw-if-not-resolved="false"></xref> with per-dim FirstOrder, TotalOrder, and Chebyshev-weighted global Variance.
    content.vb: Public Function SobolIndices() As SobolResult
  overload: ChebyshevSharp.ChebyshevSpline.SobolIndices*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: If <xref href="ChebyshevSharp.ChebyshevSpline.Build(System.Boolean)" data-throw-if-not-resolved="false"></xref> has not been called.
