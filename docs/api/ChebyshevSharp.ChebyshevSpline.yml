  nameWithType: ChebyshevSpline.WithSpecialPoints(Func<double[], object?, double>, int, double[][], double[][], int[][]?, int[]?, double?, int, int)
  fullName: ChebyshevSharp.ChebyshevSpline.WithSpecialPoints(System.Func<double[], object?, double>, int, double[][], double[][], int[][]?, int[]?, double?, int, int)
  type: Method
  source:
    id: WithSpecialPoints
    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevSpline.cs
    startLine: 702
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Create a <xref href="ChebyshevSharp.ChebyshevSpline" data-throw-if-not-resolved="false"></xref> with kinks declared via <code class="paramref">specialPoints</code>

    (a more user-friendly name than <code>knots</code> when the function has known non-smooth points).

    Functionally equivalent to passing the same values as knots to a regular constructor.
  remarks: >-
    Python's <code>ChebyshevApproximation(special_points=...)</code> returns a

    <code>ChebyshevSpline</code> at construction time.  C# constructors cannot return a

    different type; this static factory is the C#-idiomatic equivalent.

    Exactly one of <code class="paramref">nNodesNested</code>, <code class="paramref">nNodes</code>, or

    <code class="paramref">errorThreshold</code> must be supplied.
  example: []
  syntax:
    content: public static ChebyshevSpline WithSpecialPoints(Func<double[], object?, double> function, int numDimensions, double[][] domain, double[][] specialPoints, int[][]? nNodesNested = null, int[]? nNodes = null, double? errorThreshold = null, int maxN = 64, int maxDerivativeOrder = 2)
    parameters:
    - id: function
      type: System.Func{System.Double[],System.Object,System.Double}
      description: Function to approximate.
    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds per dimension.
    - id: specialPoints
      type: System.Double[][]
      description: >-
        Per-dim list of kink locations. Equivalent to knots;
            outer length must equal <code class="paramref">numDimensions</code>.
    - id: nNodesNested
      type: System.Int32[][]
      description: >-
        Per-sub-interval node counts (per dim, per piece).
            Mutually exclusive with <code class="paramref">errorThreshold</code>.
    - id: nNodes
      type: System.Int32[]
      description: >-
        Flat per-dim node counts (shared across pieces).
            Mutually exclusive with <code class="paramref">nNodesNested</code> and <code class="paramref">errorThreshold</code>.
    - id: errorThreshold
      type: System.Nullable{System.Double}
      description: >-
        Target error per piece.
            Mutually exclusive with <code class="paramref">nNodes</code>/<code class="paramref">nNodesNested</code>.
    - id: maxN
      type: System.Int32
      description: Cap on doubling-loop nodes per dimension (default 64).
    - id: maxDerivativeOrder
      type: System.Int32
      description: Maximum derivative order to support (default 2).
    return:
      type: ChebyshevSharp.ChebyshevSpline
      description: An unbuilt <xref href="ChebyshevSharp.ChebyshevSpline" data-throw-if-not-resolved="false"></xref> ready for <code>Build()</code>.
    content.vb: Public Shared Function WithSpecialPoints([function] As Func(Of Double(), Object, Double), numDimensions As Integer, domain As Double()(), specialPoints As Double()(), nNodesNested As Integer()() = Nothing, nNodes As Integer() = Nothing, errorThreshold As Double? = Nothing, maxN As Integer = 64, maxDerivativeOrder As Integer = 2) As ChebyshevSpline
  overload: ChebyshevSharp.ChebyshevSpline.WithSpecialPoints*
  nameWithType.vb: ChebyshevSpline.WithSpecialPoints(Func(Of Double(), Object, Double), Integer, Double()(), Double()(), Integer()(), Integer(), Double?, Integer, Integer)
  fullName.vb: ChebyshevSharp.ChebyshevSpline.WithSpecialPoints(System.Func(Of Double(), Object, Double), Integer, Double()(), Double()(), Integer()(), Integer(), Double?, Integer, Integer)
  name.vb: WithSpecialPoints(Func(Of Double(), Object, Double), Integer, Double()(), Double()(), Integer()(), Integer(), Double?, Integer, Integer)
