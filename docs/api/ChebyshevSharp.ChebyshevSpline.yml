  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: Create a piecewise Chebyshev spline with optional error-driven auto-N construction.
  remarks: 'Thread safety: the user-supplied function must be thread-safe when <code class="paramref">nWorkers</code> is non-null.'
  example: []
  syntax:
    content: public ChebyshevSpline(Func<double[], object?, double> function, int numDimensions, double[][] domain, int?[]? nNodes = null, double[][]? knots = null, double? errorThreshold = null, int maxN = 64, int maxDerivativeOrder = 2, object? additionalData = null, bool deferBuild = false, int? nWorkers = null, IProgress<int>? progress = null)
    parameters:
    - id: function
      type: System.Func{System.Double[],System.Object,System.Double}
      description: Function to approximate.
    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds per dimension.
    - id: nNodes
      type: System.Nullable{System.Int32}[]
      description: Number of nodes per dimension; null entries signal auto-N. Pass null to make every dim auto-N (requires errorThreshold).
    - id: knots
      type: System.Double[][]
      description: Interior knots per dimension. Null defaults to empty arrays (single piece per dim).
    - id: errorThreshold
      type: System.Nullable{System.Double}
      description: Target supremum-norm error per piece. Required if any nNodes entry is null.
    - id: maxN
      type: System.Int32
      description: Cap on nodes per dimension during the doubling loop (default 64, must be at least 3).
    - id: maxDerivativeOrder
      type: System.Int32
      description: Maximum derivative order to support (default 2).
    - id: additionalData
      type: System.Object
      description: Optional user data object threaded through every f(point, data) call during Build.
    - id: deferBuild
      type: System.Boolean
      description: If true, skip eager build. Call <xref href="ChebyshevSharp.ChebyshevSpline.SetOriginalFunctionValues(System.Double%5b%5d)" data-throw-if-not-resolved="false"></xref> to finish construction.
    - id: nWorkers
      type: System.Nullable{System.Int32}
      description: Number of parallel workers for function evaluation. null = sequential; -1 = <xref href="System.Environment.ProcessorCount" data-throw-if-not-resolved="false"></xref>; positive = exact count.
