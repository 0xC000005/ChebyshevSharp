  summary: >-
    Result of <code>SobolIndices()</code> on Chebyshev interpolants: per-dimension

    Sobol sensitivity indices computed from spectral Chebyshev coefficients

    (no Monte Carlo).
  example: []
  syntax:
    content: public SobolResult(double[] FirstOrder, double[] TotalOrder, double Variance)
    parameters:
    - id: FirstOrder
      type: System.Double[]
      description: First-order index per dimension. Sums to ≤ 1; sums to 1 for purely additive functions.
    - id: TotalOrder
      type: System.Double[]
      description: Total-order index per dimension. <code>FirstOrder[d] ≤ TotalOrder[d]</code> always.
    - id: Variance
      type: System.Double
      description: >-
        Total spectral variance Σ_{α≠0} c_α² ‖T_α‖². When zero or at numerical

        noise level, the function is effectively constant and the indices are

        meaningless.
    content.vb: Public Sub New(FirstOrder As Double(), TotalOrder As Double(), Variance As Double)
