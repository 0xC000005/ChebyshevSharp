  commentId: M:ChebyshevSharp.ChebyshevSlider.Integrate(System.Int32[],System.ValueTuple{System.Double,System.Double}[])
  id: Integrate(System.Int32[],System.ValueTuple{System.Double,System.Double}[])
  parent: ChebyshevSharp.ChebyshevSlider
  langs:
  - csharp
  - vb
  name: Integrate(int[]?, (double lo, double hi)[]?)
  nameWithType: ChebyshevSlider.Integrate(int[]?, (double lo, double hi)[]?)
  fullName: ChebyshevSharp.ChebyshevSlider.Integrate(int[]?, (double lo, double hi)[]?)
  type: Method
  source:
    id: Integrate
    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevSlider.cs
    startLine: 377
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Integrate the slider approximation over one or more dimensions.

    Uses the closed-form decomposition of the sliding sum:
      f(x) ≈ pv + Σ_i [s_i(x_{G_i}) - pv]
    Each slide's integral is computed via <xref href="ChebyshevSharp.ChebyshevApproximation.Integrate(System.Int32%5b%5d%2cSystem.ValueTuple%7bSystem.Double%2cSystem.Double%7d%5b%5d)" data-throw-if-not-resolved="false"></xref>.
  example: []
  syntax:
    content: public object Integrate(int[]? dims = null, (double lo, double hi)[]? bounds = null)
    parameters:
    - id: dims
      type: System.Int32[]
      description: Dimensions to integrate out. Null = all (full integration → scalar).
    - id: bounds
      type: System.ValueTuple{System.Double,System.Double}[]
      description: Sub-interval bounds per dim (positional with sorted dims). Null = full domain.
    return:
      type: System.Object
      description: A boxed <code>double</code> when every dim is integrated; otherwise a new <xref href="ChebyshevSharp.ChebyshevSlider" data-throw-if-not-resolved="false"></xref> over surviving dims.
    content.vb: Public Function Integrate(dims As Integer() = Nothing, bounds As (lo As Double, hi As Double)() = Nothing) As Object
  overload: ChebyshevSharp.ChebyshevSlider.Integrate*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: If <xref href="ChebyshevSharp.ChebyshevSlider.Build(System.Boolean)" data-throw-if-not-resolved="false"></xref> has not been called.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: If <code class="paramref">dims</code> contains out-of-range indices, or <code class="paramref">bounds</code> are invalid. Duplicate <code class="paramref">dims</code> entries are silently deduplicated (matches <xref href="ChebyshevSharp.ChebyshevApproximation.Integrate(System.Int32%5b%5d%2cSystem.ValueTuple%7bSystem.Double%2cSystem.Double%7d%5b%5d)" data-throw-if-not-resolved="false"></xref>).
  nameWithType.vb: ChebyshevSlider.Integrate(Integer(), (lo As Double, hi As Double)())
  fullName.vb: ChebyshevSharp.ChebyshevSlider.Integrate(Integer(), (lo As Double, hi As Double)())
  name.vb: Integrate(Integer(), (lo As Double, hi As Double)())
