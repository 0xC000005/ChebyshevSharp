  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Evaluate the slider approximation at a point.

    Uses Equation 7.5: f(x) ≈ f(z) + Σᵢ [sᵢ(x_groupᵢ) - f(z)].

    For derivatives, only the slide containing that dimension contributes.

    Cross-group mixed partials are exactly zero.
  example: []
  syntax:
    content: public double Eval(double[] point, int[] derivativeOrder)
    parameters:
    - id: point
      type: System.Double[]
      description: Evaluation point in the full n-dimensional space.
    - id: derivativeOrder
      type: System.Int32[]
      description: Derivative order for each dimension (0 = function value).
    return:
      type: System.Double
      description: Approximated function value or derivative.
    content.vb: Public Function Eval(point As Double(), derivativeOrder As Integer()) As Double
  overload: ChebyshevSharp.ChebyshevSlider.Eval*
  nameWithType.vb: ChebyshevSlider.Eval(Double(), Integer())
