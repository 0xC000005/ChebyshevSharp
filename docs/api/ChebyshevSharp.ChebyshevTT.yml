  summary: >-
    Build a TT directly from a precomputed dense tensor (skips function evaluation).

    Uses TT-SVD for compression. The resulting TT has <code>Function = null</code>.
  example: []
  syntax:
    content: public static ChebyshevTT FromValues(double[] tensorValues, int numDimensions, double[][] domain, int[] nNodes, int maxRank = 10, double tolerance = 1E-06)
    parameters:
    - id: tensorValues
      type: System.Double[]
      description: Flat row-major dense tensor of length Π nNodes.
    - id: numDimensions
      type: System.Int32
      description: Number of dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds [lo, hi] per dimension.
    - id: nNodes
      type: System.Int32[]
      description: Number of nodes per dimension.
    - id: maxRank
      type: System.Int32
      description: Maximum TT rank (default 10).
    - id: tolerance
      type: System.Double
      description: SVD truncation tolerance (default 1e-6).
    return:
      type: ChebyshevSharp.ChebyshevTT
