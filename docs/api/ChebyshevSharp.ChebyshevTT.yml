  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: Create a new ChebyshevTT interpolant.
  remarks: 'Thread safety: TT-Cross is inherently sequential; <code class="paramref">nWorkers</code> is accepted but has no effect.'
  example: []
  syntax:
    content: public ChebyshevTT(Func<double[], double> function, int numDimensions, double[][] domain, int[] nNodes, int maxRank = 10, double tolerance = 1E-06, int maxSweeps = 10, int maxDerivativeOrder = 2, object? additionalData = null, int? nWorkers = null, IProgress<int>? progress = null)
    parameters:
    - id: function
      type: System.Func{System.Double[],System.Double}
      description: 'Function to approximate. Signature: f(point) -&gt; double.'
    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds [lo, hi] for each dimension.
    - id: nNodes
      type: System.Int32[]
      description: Number of Chebyshev nodes per dimension.
    - id: maxRank
      type: System.Int32
      description: Maximum TT rank. Default is 10.
    - id: tolerance
      type: System.Double
      description: Convergence tolerance for TT-Cross. Default is 1e-6.
    - id: maxSweeps
      type: System.Int32
      description: Maximum number of TT-Cross sweeps. Default is 10.
    - id: maxDerivativeOrder
      type: System.Int32
      description: Maximum derivative order to support. Default is 2.
    - id: additionalData
      type: System.Object
      description: Optional user data object stored for introspection via <xref href="ChebyshevSharp.ChebyshevTT.GetAdditionalData" data-throw-if-not-resolved="false"></xref>. NOT threaded through build calls (TT function signature has no data arg).
    - id: nWorkers
      type: System.Nullable{System.Int32}
      description: >-
        Accepted for API symmetry with the other classes but
            ignored: TT-Cross is adaptive sampling, not pre-grid evaluation. Pass null.
    - id: progress
      type: System.IProgress{System.Int32}
      description: >-
        Optional progress reporter; receives the cumulative
            sweep count after each TT-Cross sweep.
    content.vb: Public Sub New([function] As Func(Of Double(), Double), numDimensions As Integer, domain As Double()(), nNodes As Integer(), maxRank As Integer = 10, tolerance As Double = 1E-06, maxSweeps As Integer = 10, maxDerivativeOrder As Integer = 2, additionalData As Object = Nothing, nWorkers As Integer? = Nothing, progress As IProgress(Of Integer) = Nothing)
  overload: ChebyshevSharp.ChebyshevTT.#ctor*
