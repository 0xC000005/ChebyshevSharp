    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevTT.cs
    startLine: 2115
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Realign storage to a target permutation via TT-swap (adjacent-axis SVDs in

    coefficient space). Functional API; returns a new TT. Inherits all build

    parameters (maxRank, tolerance, maxSweeps, descriptor, additionalData,

    maxDerivativeOrder, Method) from this TT.
  example: []
  syntax:
    content: public ChebyshevTT Reorder(int[] newOrder, int? maxRank = null, double? tolerance = null)
    parameters:
    - id: newOrder
      type: System.Int32[]
      description: Target permutation; must be a permutation of [0, NumDimensions-1].
    - id: maxRank
      type: System.Nullable{System.Int32}
      description: "Optional override for swap-time SVD truncation. Default: this TT's maxRank."
    - id: tolerance
      type: System.Nullable{System.Double}
      description: "Optional relative-tolerance cutoff. Default: this TT's tolerance."
    return:
      type: ChebyshevSharp.ChebyshevTT
      description: A new TT with <code>DimOrder == newOrder</code>.
    content.vb: Public Function Reorder(newOrder As Integer(), maxRank As Integer? = Nothing, tolerance As Double? = Nothing) As ChebyshevTT
  overload: ChebyshevSharp.ChebyshevTT.Reorder*
