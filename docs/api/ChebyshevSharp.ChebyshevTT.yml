  type: Method
  source:
    id: Roots
    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevTT.cs
    startLine: 1061
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Find all real roots of the TT-approximated function along a specified dimension.

    Reduces to a 1-D problem by slicing all other dimensions to their fixed

    values, then delegates to <xref href="ChebyshevSharp.ChebyshevApproximation.Roots(System.Nullable%7bSystem.Int32%7d%2cSystem.Collections.Generic.Dictionary%7bSystem.Int32%2cSystem.Double%7d)" data-throw-if-not-resolved="false"></xref>.
  remarks: >-
    Under non-identity <xref href="ChebyshevSharp.ChebyshevTT.DimOrder" data-throw-if-not-resolved="false"></xref>, dim and fixedDims keys translate

    to storage frame transparently inside <xref href="ChebyshevSharp.ChebyshevTT.Slice(System.Int32%2cSystem.Double)" data-throw-if-not-resolved="false"></xref> and

    <xref href="ChebyshevSharp.ChebyshevTT.ToDense" data-throw-if-not-resolved="false"></xref>.

    Python source: <code>ref/PyChebyshev/src/pychebyshev/tensor_train.py:1749-1790</code>.
  example: []
  syntax:
    content: public double[] Roots(int? dim = null, Dictionary<int, double>? fixedDims = null)
    parameters:
    - id: dim
      type: System.Nullable{System.Int32}
      description: User-frame dimension. For 1-D TTs, defaults to 0.
    - id: fixedDims
      type: System.Collections.Generic.Dictionary{System.Int32,System.Double}
      description: >-
        For multi-D, <code>{dim_index: value}</code> for all
            user-frame dims except <code class="paramref">dim</code>. Validated against
            user-frame domain.
    return:
      type: System.Double[]
      description: Sorted real root locations in the physical domain. Empty if no roots.
    content.vb: Public Function Roots([dim] As Integer? = Nothing, fixedDims As Dictionary(Of Integer, Double) = Nothing) As Double()
  overload: ChebyshevSharp.ChebyshevTT.Roots*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: If <xref href="ChebyshevSharp.ChebyshevTT.Build(System.Boolean%2cSystem.Nullable%7bSystem.Int32%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> has not been called.
  - type: System.ArgumentException
    commentId: T:System.ArgumentException
    description: If validation fails.
  nameWithType.vb: ChebyshevTT.Roots(Integer?, Dictionary(Of Integer, Double))
  fullName.vb: ChebyshevSharp.ChebyshevTT.Roots(Integer?, System.Collections.Generic.Dictionary(Of Integer, Double))
  name.vb: Roots(Integer?, Dictionary(Of Integer, Double))
