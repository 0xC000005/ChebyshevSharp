    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevTT.cs
    startLine: 2254
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Build a TT trying multiple dim orderings, returning the lowest-rank result.

    TT-Cross compression depends on dim order; different orderings yield different

    ranks for the same function. Mirrors PyChebyshev <code>tensor_train.py:2687</code>.
  example: []
  syntax:
    content: public static ChebyshevTT WithAutoOrder(Func<double[], double> function, int numDimensions, double[][] domain, int[] numNodes, int maxRank = 10, double tolerance = 1E-06, int maxSweeps = 10, object? additionalData = null, int nTrials = 5, string method = "greedy_swap", int? seed = null, IProgress<int>? progress = null, bool verbose = false)
    parameters:
    - id: function
      type: System.Func{System.Double[],System.Double}
      description: f(point) → double in the original (user) dim order.
    - id: numDimensions
      type: System.Int32
      description: Number of input dimensions.
    - id: domain
      type: System.Double[][]
      description: Bounds for each dimension in original order.
    - id: numNodes
      type: System.Int32[]
      description: Node counts per dimension in original order.
    - id: maxRank
      type: System.Int32
      description: Maximum TT rank passed to each trial. Default 10.
    - id: tolerance
      type: System.Double
      description: Convergence tolerance for each trial. Default 1e-6.
    - id: maxSweeps
      type: System.Int32
      description: Max TT-Cross sweeps per trial. Default 10.
    - id: additionalData
      type: System.Object
      description: Stored on the result for introspection; not threaded into f.
    - id: nTrials
      type: System.Int32
      description: Number of swap iterations / random samples. Default 5.
    - id: method
      type: System.String
      description: "\"greedy_swap\" (default, deterministic) or \"random\"."
    - id: seed
      type: System.Nullable{System.Int32}
      description: Optional seed for "random". Ignored by "greedy_swap".
    - id: progress
      type: System.IProgress{System.Int32}
      description: Optional per-sweep progress reporter (forwarded to each trial's Build).
    - id: verbose
      type: System.Boolean
      description: If true, print per-trial diagnostics.
    return:
      type: ChebyshevSharp.ChebyshevTT
      description: The lowest-total-rank TT among the tried permutations, with <code>DimOrder</code> set.
    content.vb: Public Shared Function WithAutoOrder([function] As Func(Of Double(), Double), numDimensions As Integer, domain As Double()(), numNodes As Integer(), maxRank As Integer = 10, tolerance As Double = 1E-06, maxSweeps As Integer = 10, additionalData As Object = Nothing, nTrials As Integer = 5, method As String = "greedy_swap", seed As Integer? = Nothing, progress As IProgress(Of Integer) = Nothing, verbose As Boolean = False) As ChebyshevTT
