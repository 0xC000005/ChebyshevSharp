  commentId: M:ChebyshevSharp.ChebyshevTT.SobolIndices
  id: SobolIndices
  parent: ChebyshevSharp.ChebyshevTT
  langs:
  - csharp
  - vb
  name: SobolIndices()
  nameWithType: ChebyshevTT.SobolIndices()
  fullName: ChebyshevSharp.ChebyshevTT.SobolIndices()
  type: Method
  source:
    id: SobolIndices
    path: /home/max/Documents/ChebyshevSharp/.worktrees/release-v0.12.0/src/ChebyshevSharp/ChebyshevTT.cs
    startLine: 2200
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Compute first-order + total-order variance-based sensitivity indices natively

    from the TT coefficient cores. The variance is with respect to the Chebyshev

    orthogonality weight on the normalized domain. O(d · n · r²) per dim,

    no dense materialization.
  remarks: >-
    Mathematically equivalent to <xref href="ChebyshevSharp.ChebyshevApproximation.SobolIndices" data-throw-if-not-resolved="false"></xref>

    applied to the dense version of the same function, but skips the O(n^d)

    materialization. Under non-identity <xref href="ChebyshevSharp.ChebyshevTT.DimOrder" data-throw-if-not-resolved="false"></xref>, result keys are

    translated from storage frame to user frame internally.

    Python source: <code>ref/PyChebyshev/src/pychebyshev/tensor_train.py:2823-2868</code>.
  example: []
  syntax:
    content: public SobolResult SobolIndices()
    return:
      type: ChebyshevSharp.SobolResult
      description: <xref href="ChebyshevSharp.SobolResult" data-throw-if-not-resolved="false"></xref> with arrays keyed by user-frame dim indices and Chebyshev-weighted total Variance.
    content.vb: Public Function SobolIndices() As SobolResult
  overload: ChebyshevSharp.ChebyshevTT.SobolIndices*
  exceptions:
  - type: System.InvalidOperationException
    commentId: T:System.InvalidOperationException
    description: If <xref href="ChebyshevSharp.ChebyshevTT.Build(System.Boolean%2cSystem.Nullable%7bSystem.Int32%7d%2cSystem.String)" data-throw-if-not-resolved="false"></xref> has not been called.
