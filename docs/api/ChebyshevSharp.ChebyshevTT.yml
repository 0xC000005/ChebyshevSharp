  id: WithAutoOrder(System.Func{System.Double[],System.Double},System.Int32,System.Double[][],System.Int32[],System.Int32,System.Double,System.Int32,System.Object,System.Int32,System.String,System.Nullable{System.Int32},System.IProgress{System.Int32},System.Boolean)
