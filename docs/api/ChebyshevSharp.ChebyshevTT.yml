    description: If <code class="paramref">dims</code> contains out-of-range indices, or <code class="paramref">bounds</code> are invalid. Duplicate <code class="paramref">dims</code> entries are silently deduplicated (matches <xref href="ChebyshevSharp.ChebyshevApproximation.Integrate(System.Int32%5b%5d%2cSystem.ValueTuple%7bSystem.Double%2cSystem.Double%7d%5b%5d)" data-throw-if-not-resolved="false"></xref>).
