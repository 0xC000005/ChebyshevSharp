    startLine: 727
  assemblies:
  - ChebyshevSharp
  namespace: ChebyshevSharp
  summary: >-
    Integrate the TT-approximated function over selected dimensions.

    Per-dim Fejér-1 quadrature is applied to the value-space cores

    (Chebyshev coefficient cores are converted to value cores via

    <xref href="ChebyshevSharp.Internal.TensorTrainKernel.CoeffCoreToValueCore(ChebyshevSharp.Internal.TensorTrainKernel.TtCore)" data-throw-if-not-resolved="false"></xref> before contraction).
  example: []
  syntax:
    content: public object Integrate(int[]? dims = null, (double lo, double hi)[]? bounds = null)
    parameters:
    - id: dims
      type: System.Int32[]
      description: Dimensions to integrate out. Null = all (full integration → scalar).
    - id: bounds
      type: System.ValueTuple{System.Double,System.Double}[]
      description: Sub-interval bounds per dim (positional with sorted dims). Null = full domain.
    return:
      type: System.Object
      description: A boxed <code>double</code> when every dim is integrated; otherwise a new <xref href="ChebyshevSharp.ChebyshevTT" data-throw-if-not-resolved="false"></xref> over surviving dims.
    content.vb: Public Function Integrate(dims As Integer() = Nothing, bounds As (lo As Double, hi As Double)() = Nothing) As Object
  overload: ChebyshevSharp.ChebyshevTT.Integrate*
